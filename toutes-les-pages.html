/* ---------- construction du sommaire ---------- */
function echapper(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function rendreCarte(p, num) {
    var classes = "carte";
    if (p.fin) classes += " fin";
    if (p.jeu) classes += " jeu";
    if (p.orpheline) classes += " orpheline";

    var html = '<article class="' + classes + '">';
    html += '<div class="entete">';
    html += '<span class="num">' + num + '.</span>';
    html += '<span class="titre"><a href="' + p.url + '">' + p.titre + '</a></span>';
    if (p.heure) html += '<span class="heure">' + p.heure + '</span>';
    html += '</div>';
    html += '<div class="fichier">' + echapper(p.url) + '</div>';

    html += '<div style="margin-top:6px">';
    if (p.fin) html += '<span class="badge fin">FIN DE BRANCHE</span> ';
    if (p.jeu) html += '<span class="badge jeu">MINI-JEU</span> ';
    if (p.orpheline) html += '<span class="badge alerte">PAGE NON LI&Eacute;E</span>';
    html += '</div>';

    if (p.texte) html += '<p class="texte">' + p.texte + '</p>';

    if (p.liens && p.liens.length) {
        html += '<div class="liens"><span class="etiquette">Vers :</span>';
        for (var i = 0; i < p.liens.length; i++) {
            html += '<a href="' + p.liens[i][1] + '">' + echapper(p.liens[i][0]) + '</a> ';
        }
        html += '</div>';
    } else {
        html += '<div class="liens"><span class="etiquette">Aucun lien vers la suite (page de fin).</span></div>';
    }

    html += '</article>';
    return html;
}

var toutesLesPages = [];

function construire() {
    var conteneur = document.getElementById("sommaire");
    var html = "";
    var num = 1;

    for (var b = 0; b < BRANCHES.length; b++) {
        var branche = BRANCHES[b];
        html += '<h2 class="branche">' + branche.nom +
                '<span class="compte">' + branche.pages.length + ' pages</span></h2>';
        for (var i = 0; i < branche.pages.length; i++) {
            html += rendreCarte(branche.pages[i], num++);
            toutesLesPages.push(branche.pages[i].url);
        }
    }

    html += '<h2 class="branche">Pages &agrave; v&eacute;rifier' +
            '<span class="compte">' + ORPHELINES.length + ' pages</span></h2>';
    html += '<p class="note">Ces pages existent mais aucune autre page du livre n'y m&egrave;ne. ' +
            'Elles ne sont donc pas atteignables en jouant&nbsp;: soit il manque un lien, ' +
            'soit ce sont des restes de l\'ancienne version.</p>';

    conteneur.innerHTML = html;
}

/* ---------- ouvrir toutes les pages ---------- */
function ouvrirTout() {
    for (var i = 0; i < toutesLesPages.length; i++) {
        var f = function (url) {
            return function () { window.open(url, "_blank"); };
        }(toutesLesPages[i]);
        setTimeout(f, i * 60);
    }
}

/* ---------- mode lecture : tout le livre sur une page ---------- */
var lecturePrete = false;

function basculerLecture() {
    var zone = document.getElementById("lecture");
    if (!lecturePrete) {
        var html = "";
        for (var i = 0; i < BRANCHES.length; i++) {
            for (var j = 0; j < BRANCHES[i].pages.length; j++) {
                var p = BRANCHES[i].pages[j];
                html += '<div class="page-lecture">';
                html += '<div class="bandeau"><span>' + p.titre + '</span>' +
                        '<a href="' + p.url + '">ouvrir seule &#8599;</a></div>';
                html += '<iframe src="' + p.url + '" title="' + p.titre + '" loading="lazy"></iframe>';
                html += '</div>';
            }
        }
        zone.innerHTML = html;
        lecturePrete = true;
    }
    zone.classList.toggle("visible");
}

construire();
